x-app-env: &app-env
  DATABASE_HOST: database
  DATABASE_PORT: 5432
  DATABASE_NAME: app_db
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: postgres
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: admin
  RABBITMQ_PASSWORD: mypass
  TASK_QUEUE_USE_IN_MEMORY_BROKER: "false"

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: mypass
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local Grafana stack (same OTLP path as Grafana Cloud): OTel collector -> Tempo, Prometheus
  # (PromQL) and Loki. OTLP on 4317/4318, Grafana on http://localhost:3000 (anonymous admin).
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["otel"]
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  api:
    build: .
    profiles: ["app"]
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
      RUN_MIGRATIONS_ON_STARTUP: "true"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    profiles: ["app"]
    command: bash task_queue/start-worker.sh
    environment:
      <<: *app-env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
